services:
  postgres:
    # 0.8.6 是 pgvector 版本，pg17 是 PostgreSQL 大版本，两者必须一起钉死
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quarry
    ports:
      - "5433:5432"          # 宿主机 5433 → 容器 5432，避开本机可能已有的 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarry -d quarry"]
      interval: 5s
      retries: 10

  redis:
    image: redis/redis-stack:7.4.0-v3
    ports:
      - "6380:6379"          # 数据端口
      - "8001:8001"          # RedisInsight 可视化界面
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata: