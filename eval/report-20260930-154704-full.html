<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评测报告</title>
<style>
:root {
  --paper: #fffdfb; --surface: #fff; --surface-2: #fcf4f0; --tint: #ece3d7;
  --ink: #1b1915; --muted: #8b8179;
  --rule: #e8e0d9; --up: #2e7d64; --down: #c0482f; --warn: #a3762a;
  --accent: #d97757; --accent-soft: #f6dcd0; --accent-line: #e8c3b2;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
/* 深色只在显式 <html data-theme="dark"> 时生效，系统深色模式不再自动切换 */
:root[data-theme="dark"] {
  --paper: #191715; --surface: #211e1c; --surface-2: #282422; --tint: #3b3531;
  --ink: #f0ece8; --muted: #9c938c;
  --rule: #38332f; --up: #5fbd9c; --down: #e5815f; --warn: #d4a44f;
  --accent: #e08a68; --accent-soft: #3a2a22; --accent-line: #57392c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.6;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 36px 20px 64px; }
h1 { font-size: 23px; margin: 0; font-weight: 700; text-align: center; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 6px; text-align: center; }
.headline { margin: 26px auto 0; font-size: clamp(18px, 2.3vw, 24px); font-weight: 500; line-height: 1.5;
  max-width: 46ch; text-align: center; }
.up { color: var(--up); } .down { color: var(--down); }
.metrics { margin-top: 26px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
.metric { padding: 13px 15px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.metric .name { font-size: 12px; color: var(--muted); }
.metric .line { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; }
.metric .val { font-size: 21px; font-weight: 700; font-family: var(--mono); letter-spacing: -.02em; }
.metric .delta { font-size: 12.5px; font-weight: 500; font-family: var(--mono); }
.bar { height: 4px; background: var(--surface-2); margin-top: 10px; position: relative; border-radius: 999px; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; background: var(--accent); }
.bar i.was { background: var(--tint); }
.gate { display: flex; flex-wrap: wrap; gap: 10px; padding: 11px 15px; font-size: 13.5px; margin-top: 10px;
  border: 1px solid var(--rule); border-radius: 10px; background: var(--surface-2); }
.gate:empty, .metrics:empty { display: none; }
.gate.pass { color: var(--up); } .gate.fail { color: var(--down); }
.gate span { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 14px; }
.chip { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip:hover { border-color: var(--accent-line); background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.chip .n { color: var(--muted); margin-left: 6px; font-family: var(--mono); font-size: 12px; }
.chip[aria-pressed="true"] .n { color: rgba(255, 255, 255, .72); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }
.list { background: none; }
.list-head, .row { display: grid; grid-template-columns: minmax(0, 1fr) 176px 92px 62px; align-items: center;
  gap: 12px; padding: 0 16px; text-align: left; }
.list-head { font-size: 12px; color: var(--muted); padding-bottom: 9px; }
.row { width: 100%; font: inherit; color: inherit; cursor: pointer; padding: 11px 15px; margin-bottom: 8px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.row:hover { background: var(--surface-2); border-color: var(--accent-line); }
.row[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.q { min-width: 0; }
.q .text, .q .path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q .text { font-size: 14.5px; }
.q .path { font-size: 12px; color: var(--muted); margin-top: 2px; }
.track { width: 176px; height: 20px; }
.verdict { font-size: 11.5px; font-family: var(--mono); padding: 2px 9px; border-radius: 999px; display: inline-block; white-space: nowrap; }
.v-supported { background: color-mix(in srgb, var(--up) 13%, transparent); color: var(--up); }
.v-partial { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.v-unsupported { background: color-mix(in srgb, var(--down) 13%, transparent); color: var(--down); }
.v-none { color: var(--muted); }
.ms { font-size: 12.5px; color: var(--muted); text-align: right; font-family: var(--mono); }
.detail { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
@media (min-width: 1000px) { .detail { position: sticky; top: 20px; max-height: calc(100vh - 44px); overflow-y: auto; } }
.detail-in { padding: 17px 18px 18px; }
.detail h2 { font-size: 15.5px; margin: 0 0 5px; line-height: 1.45; font-weight: 600; }
.detail-in > .gold { font-size: 12px; color: var(--muted); margin-bottom: 15px; }
.run-block { border-top: 1px solid var(--rule); padding-top: 13px; margin-top: 13px; }
.run-block:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.run-name { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.ev { border-left: 2px solid var(--rule); padding: 7px 0 7px 11px; margin-top: 10px; font-size: 13px; }
.ev.gold { border-left-color: var(--accent); }
.ev .meta { font-size: 10.5px; color: var(--muted); font-family: var(--mono); display: flex; gap: 9px; flex-wrap: wrap; }
.ev .snippet { margin-top: 4px; line-height: 1.65; white-space: pre-wrap; }
.ph { background: var(--accent-soft); border-radius: 3px; padding: 0 4px; font-size: 12.5px; white-space: nowrap; }
.facts { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
.fact { font-size: 12px; display: flex; gap: 7px; align-items: baseline; }
.fact b { font-family: var(--mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.d-verified { background: var(--up); } .d-expired { background: var(--warn); } .d-unverified { background: var(--tint); }
.fact .old { color: var(--muted); }
.judge-box { font-size: 12.5px; color: var(--muted); margin-top: 11px; }
.empty { padding: 26px 4px; color: var(--muted); font-size: 13.5px; line-height: 1.75; }
footer { margin-top: 32px; font-size: 12px; color: var(--muted); line-height: 1.8; }
@media (max-width: 720px) {
  .list-head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) 96px; }
  .track { width: 96px; }
  .ms, .verdict-cell { display: none; }
}
</style>
</head>

</div>

eighbors"}, {"gold": true, "path": "了解", "text": "洛阳市（汉语拼音：Luòyáng，邮政式拼音：Loyang）是河南省的一个城市，位于河南省西部。\n\n洛陽市，位于中华人民共和国河南省，2011年被联合国国际减灾战略署、世界城市科学发展联盟、国际姐妹城市联盟联合授予“世界文化名城”称号，河南省及中原城市群的副中心城市，丝绸之路东起点。有十省通衢之称。洛阳位于洛水之北，水之北乃谓“阳”，故名洛阳，又称雒陽、雒邑、京洛和洛城，因境內有伊、洛兩水，也稱伊洛。洛阳地处中原，境内山川纵横，西依秦岭，过函谷关是陕西的关中平原，东临嵩岳，北靠太行山又有黄河之险，南望伏牛山，有“河山拱戴，形势甲于天下”之说。洛阳最早建成于夏朝（二里头遗址），有夏、商、西周、东周、东汉、曹魏、西晋、北魏、隋、唐、后梁、后唐、后晋等13个朝代在此定都，定都历史有1529年之久，因此有“十三朝古都”", "facts": [], "level": "neighbors"}]}, "new": {"rank": 3, "ms": 693, "abstained": false, "judge": "supported", "judge_reason": "证据明确列出龙门石窟、白马寺、千唐志斋、含嘉仓遗址、回洛仓遗址等著名景点。", "evidence": [{"gold": false, "path": "观光", "text": "国道方面， 310国道由连云港经洛阳至天水、共和， 207国道由锡林浩特经洛阳至海安， 311国道由连云港、徐州经洛阳栾川至西峡；高速公路方面， 连霍高速公路连云港经洛阳至霍尔果斯， 二广高速公路二连浩特经洛阳至广州， 宁洛高速公路洛阳至南京，少洛高速公路洛阳至少林寺， 盐洛高速公路至许昌、亳州、宿州、盐城，另外还有洛阳绕城高速公路、洛阳栾川高速公路和洛阳卢氏高速公路使洛阳与周边县市之间的往来更加便捷。\n十二五时期，洛阳将改造、新建洛阳至偃师、孟津、吉利、伊川、宜阳、新安六县（市）区的5条快速通道项目，完善中心城区到周边县（市）区快速骨干路网，构建半小时经济圈，形成市县产业与交通融合的新型城市格局，进而拉动周边县市加快发展。\n\n1 龍門石窟，地址 中國河南省洛陽市南郊12公里處，📞 +86 379 6598 0", "facts": [{"ref": "F1", "label": "门票价格", "value": "30", "entity": "千唐志斋", "status": "unverified", "written": [], "qualifier": "全年", "verified_at": null}, {"ref": "F2", "label": "门票价格", "value": "120", "entity": "龍門石窟", "status": "unverified", "written": [], "qualifier": "全年", "verified_at": null}, {"ref": "F3", "label": "门票价格", "value": "35", "entity": "白马寺", "status": "unverified", "written": [], "qualifier": "全年", "verified_at": null}], "level": "neighbors"}, {"gold": false, "path": "下一站 > 省外", "text": "咸阳，距离西安非常近，周边有许多帝王陵墓和古代遗迹，包括乾陵、昭陵等。\n宝鸡，著名的景点为扶风县附近的法门寺。宝鸡市周边的关山草原，眉县南部的太白山，凤县周围的紫柏山等景区也值得一看。\n渭南，因西岳华山而闻名。渭南市域北部的韩城市有司马迁祠，黄河龙门等旅游景点。\n铜川，位于西安北部，有药王山，耀州窑博物馆等\n除此之外也可前往陕北或陕南继续游览。\n\n天水，有麦积山石窟。\n洛阳，有龙门石窟，是另一个古城。\n下面是可以成为下一站的景点：\n\n汉阳陵，即汉景帝刘启的陵墓，迄今发现的保存最完整的汉代帝陵陵园，陵区内200多座陪葬坑中出土的武士俑披坚执锐、严阵以待，仕女俑宽衣博带、美目流盼，动物俑累千成万、生动异常。据测算，阳陵的陶俑总数可达数万个。伴随出土文物以金属器物为主，有铜簇、弩机、带钩、马衔、“半两钱”、铁矛、戟、", "facts": [], "level": "neighbors"}, {"gold": true, "path": "了解", "text": "洛阳市（汉语拼音：Luòyáng，邮政式拼音：Loyang）是河南省的一个城市，位于 ery": "漓江在20元人民币的哪一面？", "kind": "answerable", "note": null, "dir": "same", "base": {"rank": 1, "ms": 718, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出漓江印在20元人民币北面。", "evidence": [{"gold": true, "path": "", "text": "桂林 （Guì​lín）是中国广西壮族自治区北部城市。桂林是一个风景秀丽的城市，也是中国最著名的景点之一。在桂林有非常多的景点。包括以梯田闻名的龙胜；印在20元人民币北面的漓江；阳朔，桂林附近的一个小县城；还有更多景点。这些都使得桂林成为探索广西北部地区的一个天然基地。\n桂林是个美丽的城市。城中心被两条河流和四个湖泊所环绕，而且有很多陡峭的喀斯特山峰遍布于此。在城中心以外的建筑的状况不是特别好。由于桂林的主要产业是旅游业，所以它比中国很多其他城市干净得多。\n桂林本身和中国大部分其他中等规模的城市一样，但是它有大量的西式酒店、西方游客，并且空气质量相对比较好。中国游客也蜂拥于此。桂林的最大特色是它周围风景如画的石灰岩山和地形。\n\n南岭将广西和中国中部以及长江流域隔开，因此广西一直以来较之中国其他地区都独具特色。中", "facts": [], "level": "neighbors"}, {"gold": false, "path": "观光", "text": "桂林公交常见价格为全程2元，不设找零。\n出租车\n起步价约9元，适合短途出行。注意在景区可能会有司机拒绝打表，可事先谈好价格。\n\n葡萄峰林（桂林阳朔）。簡介 作为峰林喀斯特，于2014年增补入世界自然遗产「中国南方喀斯特」。徒步路线：桂林火车南站乘阳朔大巴（15元）到杨提路口南约1.5公里的仁和路口（马路西侧）下车，徒步3.5公里到铁厂村，村前田垌中有一条石板小路，沿着它自西向东走到村北侧，再自南向北，翻过李厄，就到了四面峰林环绕的狮子嵅，狮子嵅北侧的水泥乡道向东走3.5公里，东出良丰农场葡萄分场（八队农场），到达桂阳公路，乘阳朔大巴返回桂林。以上路线中，铁厂村到狮子嵅为2013年联合国教科文组织专家的考察路线之一。\n漓江峰丛（桂林漓江两岸）。💰 ¥270(船票)。簡介 作为峰林喀斯特，于2014年增补入世界自然", "facts": [{"ref": "F1", "label": "门票价格", "value": "130", "entity": "独秀峰王城景区", "status": "unverified", "written": [], "qualifier": "全年", "verified_at": null}], "level": "neighbors"}, {"gold": false, "path": "抵达 > 航空", "text": "桂林市下辖6区、10县，代管1县级市：\n\n1 桂林两江国际机场（Guilin Liangjiang International Airport），地址 桂林市两江镇。 (更新日期：2017年11月)\n\n目前有八条机场大巴：\n\n1号线两江国际机场–城市候机楼（民航大厦）（往市区单向停靠天鹅宾馆），票价¥20\n2号线两江国际机场–桂林北站（幸福挺至尊酒店），票价¥20\n3号线两江国际机场–临桂福朋喜来登酒店–城市候机楼（万福广场维也纳酒店），票价¥20\n4号线两江国际机场–柳州汽车南站，票价¥50\n5号线两江国际机场–贺州国际酒店，桂林-贺州票价¥100，贺州-桂林票价¥70\n6号线两江国际机场–宜州汽车站，票价¥120\n7号线两江国际机场–阳朔汽车站，票价¥50\n8号线两江国际机场–荔浦汽车站，票价¥60\n\n办理", "facts": [], "level": "neighbors"}]}, "new": {"rank": 1, "ms": 715, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出漓江印在20元人民币北面。", "evidence": [{"gold": true, "path": "", "text": "桂林 （Guì​lín）是中国广西壮族自治区北部城市。桂林是一个风景秀丽的城市，也是中国最著名的景点之一。在桂林有非常多的景点。包括以梯田闻名的龙胜；印在20元人民币北面的漓江；阳朔，桂林附近的一个小县城；还有更多景点。这些都使得桂林成为探索广西北部地区的一个天然基地。\n桂林是个美丽的城市。城中心被两 甚多。大多數地方位於一流的公共交通系統之上，以確保所有的景點都近在咫尺。香港的住宿價格並不便宜，許多精打細算的旅客往往到這個城市旅行，於住宿上的開銷最大。其租金的高昂更是高達倫敦和紐約之上。\n通常HK$700被認為是合理的住宿費預算。而這預算", "facts": [], "level": "neighbors"}, {"gold": false, "path": "到达 > 入境要求 > 外国人", "text": "香港的签证政策相对中国内地更为宽松，大多數外国遊客前往香港並不需要提前獲得簽證，但是從香港進入中國大陸则是需要簽證的。\n以下國家/地區的外國人可以旅遊為目的獲得免簽證進入香港：\n最長達180天：英國（英國本土公民）\n最長達90天：英國（英國海外領土公民，英國海外公民，英籍人士和英國保護人士） ，所有歐盟成員國，安道爾，安提瓜和巴布達，阿根廷，澳大利亞，巴哈馬，巴巴多斯，伯利茲，博茨瓦納，巴西，文萊，加拿大，智利，哥倫比亞，丹麥，多米尼加，厄瓜多爾，埃及，斐濟，岡比亞，格林納達，圭亞那，冰島，以色列，牙買加，日本，肯尼亞，基里巴斯，列支敦士登，馬拉維，馬來西亞，馬爾代夫，毛里求斯，墨西哥，摩納哥，納米比亞，瑙魯，新西蘭，挪威，巴布亞新幾內亞，聖馬力諾，塞舌爾，新加坡，韓國，聖基茨和尼維斯，聖盧西亞，聖文森特和格林", "facts": [], "level": "section"}]}, "new": {"rank": 1, "ms": 756, "abstained": false, "judge": "supported", "judge_reason": "证据明确给出2011年旅游业占GDP约15.2%，2012年占4.4%", "evidence": [{"gold": true, "path": "", "text": "香港 （英語：Hong Kong，粵拼：Hoeng1 gong2）是中華人民共和國其中一個特別行政區。曾被英国實施殖民管制，因此文化深受西方影響，境內居民又以華人居多，故此香港是一個華洋雜處的社會。香港與世界各地的接觸，也令中華文化和西方文化在香港匯合。香港政府把香港定位為「亞洲國際都會」。它也以「購物天堂」、「美食天堂」之名著稱。近年來，內地實行港澳個人遊計劃，使香港成為不少內地人的旅行目的地。\n香港為世界的其中一座經濟、文化、航空及貨運的樞紐城市，位置具策略性，加上香港東西文化、新舊事物的交融，締造出香港獨特的都會文化，風貌多樣的名勝景點、郊野景緻、購物及美食，吸引到每年有約5,000萬人次到訪香港。香港旅遊業長期興旺，為全球最受歡迎的旅遊勝地之一。旅遊業為香港經濟4大支柱產業之一，世界旅行及旅遊理事會估計", "facts": [], "level": "neighbors"}, {"gold": false, "path": "住宿", "text": "香港是個不夜天，即使是凌晨時分，您還可以找到吃宵夜的好地方：茶餐廳、大牌檔、甜點店、粉麵店、火鍋店，依然提供各式小炒小菜、麵食、海鮮、火鍋或甜湯。這些地方的菜式火候十足，價錢實惠，而且氣氛無拘無束，適合大夥兒歡聚暢飲。還不滿足？您還可以到酒店去吃宵夜吃到飽呢！\n如果您沒有吃宵夜的習慣，或許來香港旅遊時可以一試。早一點吃晚餐，晚一些再吃宵夜，感受一下香港夜生活的熱鬧與隨意。\n\n詳細資料可在香港的区條目中找到。\n香港現有提供超過50,000間客房，從廉價住宿以至超豪華酒店，選擇甚多。大多數地方位於一流的公共交通系統之上，以確保所有的景點都近在咫尺。香港的住宿價格並不便宜，許多精打細算的旅客往往到這個城市旅行，於住宿上的開銷最大。其租金的高昂更是高達倫敦和紐約之上。\n通常HK$700被認為是合理的住宿費預算。而這預算", "facts": [], "level": "neighbors"}, {"gold": false, "path": "到达 > 入境要求 > 外国人", "text": "香港的签证政策相对中国内地更为宽松，大多數外国遊客前往香港並不需要提前獲得簽證，但是從香港進入中國大陸则是需要簽證的。\n以下國家/地區的外國人可以旅遊為目的獲得免簽證進入香港：\n最長達180天：英國（英國本土公民）\n最長達90天：英國（英國海外領土公民，英國海外公民，英籍人士和英國保護人士） ，所有歐盟成員國，安道爾，安提瓜和巴布達，阿根廷，澳大利亞，巴哈馬，巴巴多斯，伯利茲，博茨瓦納，巴西，文萊，加拿大，智利，哥倫比亞，丹麥，多米尼加，厄瓜多爾，埃及，斐濟，岡比亞，格林納達，圭亞那，冰島，以色列，牙買加，日本，肯尼亞，基里巴斯，列支敦士登，馬拉維，馬來西亞，馬爾代夫，毛里求斯，墨西哥，摩納哥，納米比亞，瑙魯，新西蘭，挪威，巴布亞新幾內亞，聖馬力諾，塞舌爾，新加坡，韓國，聖基茨和尼維斯，聖盧西亞，聖文森特和格林", "facts": [], "level": "section"}]}}, {"qid": "e3e3e4eefae9a190", "query": "香港燒烤常用什麼工具？", "kind": "answerable", "note": "用餐 > 餐廳類型 > 燒烤", "dir": "same", "base": {"rank": 1, "ms": 802, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出烧烤叉是最常用工具", "evidence": [{"gold": true, "path": "用餐 > 餐廳類型 > 燒烤", "text": "酒樓又稱酒家或茶樓，是一種粵式餐館，起源於廣州。現時酒樓已成為廣東、廣西部分地區和香港的主流飲食地方。現今的酒樓主要會售賣點心，午市和晚市亦會提供炒粉麵飯、小菜及燒味等中式食品。現時的酒樓已經較少以點心作為招徠。在香港，不少酒樓一般都名為海鮮酒家，亦有部份酒樓的名稱會加入火鍋或燒鵝，作為它們的招牌茶式。\n以前點心只會在早市和茶市供應，但現在通常於午市亦會有點心供應。而於1990年代中期，香港開始出現了「飲夜茶」的風氣，部份酒樓會在深夜提供點心，作為晚市的延續。酒樓在晚市通常會供應晚飯小菜，一些酒樓亦可舉行各種宴會，例如婚宴、滿月酒、春茗、團年飯等。在香港，近年酒樓舉行宴會業務的競爭力，受到酒店的威脅，不少人選擇在酒店舉行婚宴，不過酒店收費會比較高，服務質素也如是。\n\n香港燒烤文化是指香港人的燒烤形式，源於196", "facts": [], "level": "neighbors"}, {"gold": false, "path": "用餐 > 名菜 > 燒味", "text": "點心在中國各種菜系中都有，在粵菜飲茶中尤其發達，一般都是指放在蒸籠的包子及糕點。點心推出初期款式不多，通常只有大包、叉燒包、蝦餃、燒賣及腸粉等。點心是區分於中國北方飲茶的一個重大標誌，今日，中國南方飲茶的點心種類繁多，大致分為鹹點及甜點，大部分點心都是熱食，亦有小部分為冷盤。在北方菜系中，用麵為主要原料的「麵點」也是中國點心的重要分支之一。北方一個比較出色的廚師就能夠造出逾2,000種麵點。\n傳統點心包括了包點、餃子和腸粉。很多點心酒家同時提供其他菜式，例如油菜、燒肉、不同款式的粥和湯。在眾多烹飪方法中，點心通常是採用蒸、煎或炸的，而數量則是4件甚至3件一碟。\n\n燒味（粵語：siu1 mei2，英文：siu mei）是中國粵菜中的一種燒烤食品。在酒樓或中式餐館，以至華人地區的快餐店均有提供此類食物。燒味常會配合", "facts": [], "level": "neighbors"}, {"gold": false, "path": "用餐", "text": "小費在香港不算流行，但在某些服務上，香港人會把部分找續餘額留給對方。這種「整付」（round up the bill）的習俗適用於酒樓、餐廳、計程車等。比如在酒樓吃了252元，客人多數給260元。在計程車上，車費23.5元，客人會給24元至25元，一般不拿回那幾毛錢。（當然你可以向司機主動提出索取那些零錢）\n此外，不少酒樓、餐廳規定加10%服務費，例如菜價500元，結帳時，帳單會變成550元，小費另計。在茶餐廳、快餐店則完全不用給小費及找續餘額。類似歐美的小費制度只在酒店中出現。在較大型的旅店，提行李、收拾房間的人一般預期10港元左右的小費，但在背包族旅店（如重慶大廈）則可免付這類費用。\n\n香港飲食文化為東方文化及西方文化的交匯所在，發展出了一套揉合中國菜（主要為粵菜）和西餐的飲食習慣。作為全球各地人們的匯聚點", "facts": [], "level": "neighbors"}]}, "new": {"rank": 1, "ms": 744, "abstained": false, "judge": "supported", "judge_reason": "证据明确指出烧烤叉是最常用工具。", "evidence": [{"gold": true, "path": "用餐 > 餐廳類型 > 燒烤", "text": "酒樓又稱酒家或茶樓，是一種粵式餐館，起源於廣州。現時酒樓已成為廣東、廣西部分地區和香港的主流飲食地方。現今的酒樓主要會售賣點心，午市和晚市亦會提供炒粉麵飯、小菜及燒味等中式食品。現時的酒樓已經較少以點心作為招徠。在香港，不少酒樓一般都名為海鮮酒家，亦有部份酒樓的名稱會加入火鍋或燒鵝，作為它們的招牌茶式。\n以前點心 <script>
const D = JSON.parse(document.getElementById("report-data").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const mark = s => esc(s).replace(/〔([^〕]+)〕/g, '<span class="ph">〔$1〕</span>');
let filter = "all", selected = null;

$("sub").textContent = `${D.collection} 集合 · 基线 ${D.base.run_id} · 对照 ${D.new.run_id} · 生成于 ${D.generated_at}`;
$("headline").innerHTML = D.headline;
$("metrics").innerHTML = D.metrics.map(m => `<div class="metric">
  <div class="name">${esc(m.name)}</div>
  <div class="line"><span class="val">${esc(m.new)}</span><span class="delta ${m.dir}">${esc(m.delta)}</span></div>
  <div class="bar"><i class="was" style="width:${m.bar_base}%"></i><i style="width:${m.bar_new}%"></i></div>
</div>`).join("");
$("gate").className = "gate " + (D.gate.ok ? "pass" : "fail");
$("gate").innerHTML = D.gate.ok
  ? `回归闸门：✅ 通过<span>召回率、正确拒答率、证据支撑率都没有掉出阈值</span>`
  : `回归闸门：❌ 不通过<span>${D.gate.problems.map(esc).join("；")}</span>`;
$("foot").innerHTML = `基线配置 ${esc(D.base.config_text)}<br>对照配置 ${esc(D.new.config_text)}<br>`
  + `名次轨道：空心点是基线名次，实心点是对照名次，最右一格表示金块没进前 ${D.top_k} 条。`;

const FILTERS = [
  { id: "all", name: "全部", test: () => true },
  { id: "up", name: "变好", test: i => i.dir === "up" },
  { id: "down", name: "变坏", test: i => i.dir === "down" },
  { id: "miss", name: "未命中", test: i => i.kind === "answerable" && i.new.rank === null },
  { id: "judge", name: "裁判存疑", test: i => i.new.judge && i.new.judge !== "supported" },
  { id: "neg", name: "无答案", test: i => i.kind === "unanswerable" }
];

function track(item) {
  const W = 176, H = 20, pad = 9, slots = D.top_k + 1, span = (W - pad * 2) / slots;
  const x = r => pad + ((r === null ? D.top_k : r - 1) + .5) * span;
  if (item.kind === "unanswerable")
    return `<svg class="track" viewBox="0 0 ${W} ${H}"><text x="${pad}" y="14" font-size="11" fill="var(--muted)">${item.new.abstained ? "建议拒答" : "没有拒答"}</text></svg>`;
  const color = item.dir === "up" ? "var(--up)" : item.dir === "down" ? "var(--down)" : "var(--muted)";
  const ticks = Array.from({ length: slots }, (_, i) =>
    `<circle cx="${x(i === D.top_k ? null : i + 1)}" cy="10" r="1" fill="var(--rule)"/>`).join("");
  return `<svg class="track" viewBox="0 0 ${W} ${H}" role="img" aria-label="基线 ${item.base.rank ?? "未命中"}，对照 ${item.new.rank ?? "未命中"}">
    <line x1="${pad}" y1="10" x2="${W - pad}" y2="10" stroke="var(--rule)"/>${ticks}
    <line x1="${x(item.base.rank)}" y1="10" x2="${x(item.new.rank)}" y2="10" stroke="${color}" stroke-width="2.5"/>
    <circle cx="${x(item.base.rank)}" cy="10" r="4" fill="var(--surface)" stroke="${color}" stroke-width="1.5"/>
    <circle cx="${x(item.new.rank)}" cy="10" r="4.5" fill="${color}"/></svg>`;
}

function renderFilters() {
  $("filters").innerHTML = FILTERS.map(f =>
    `<button class="chip" aria-pressed="${filter === f.id}" data-f="${f.id}">${f.name}<span class="n">${D.items.filter(f.test).length}</span></button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.f; renderFilters(); renderRows(); });
}

function renderRows() {
  const rows = D.items.filter(FILTERS.find(f => f.id === filter).test);
  $("rows").innerHTML = rows.length ? rows.map(i => `<button class="row" aria-selected="${selected === i.qid}" data-id="${i.qid}">
      <span class="q"><span class="text">${esc(i.query)}</span><span class="path">${esc(i.note || "语料里没有对应内容")}</span></span>
      ${track(i)}
      <span class="verdict-cell">${i.new.judge ? `<span class="verdict v-${i.new.judge}">${i.new.judge}</span>` : `<span class="verdict v-none">—</span>`}</span>
      <span class="ms">${i.new.ms}</span>
    </button>`).join("") : `<div class="empty">这个筛选下没有问题。</div>`;
  $("rows").querySelectorAll(".row").forEach(r => r.onclick = () => { selected = r.dataset.id; renderRows(); renderDetail(); });
}

function runBlock(item, side) {
  const run = D[side], r = item[side];
  const head = item.kind === "unanswerable"
    ? (r.abstained ? "建议拒答" : "没有拒答")
    : (r.rank ? `金块第 ${r.rank} 条` : `金块未进前 ${D.top_k}`);
  const evs = r.evidence.length ? r.evidence.map((e, n) => `<div class="ev ${e.gold ? "gold" : ""}">
      <div class="meta"><span>第 ${n + 1} 条</span><span>${esc(e.path)}</span><span>${esc(e.level)}</span>${e.gold ? "<span>金块</span>" : ""}</div>
      <div class="snippet">${mark(e.text)}</div>
      ${e.facts.length ? `<div class="facts">${e.facts.map(f => `<div class="fact"><span class="dot d-${f.status}"></span><span>${esc(f.ref)} ${esc(f.entity)} ${esc(f.label)}·${esc(f.qualifier)} = <b>${esc(f.value)}</b> ${f.verified_at ? "核实于 " + esc(f.verified_at) : "未核实"}${f.written.length ? `<span class="old">（正文写的是 ${esc(f.written.join("、"))}）</span>` : ""}</span></div>`).join("")}</div>` : ""}
    </div>`).join("") : `<div class="ev"><div class="snippet">没有返回证据。</div></div>`;
  return `<div class="run-block">
    <div class="run-name"><span>${esc(run.label)}</span><span>${head} · ${r.ms} ms</span></div>
    ${evs}
    ${r.judge ? `<div class="judge-box">裁判：<span class="verdict v-${r.judge}">${r.judge}</span> ${esc(r.judge_reason || "")}</div>` : ""}
  </div>`;
}

function renderDetail() {
  const item = D.items.find(i => i.qid === selected);
  $("detail").innerHTML = item
    ? `<h2>${esc(item.query)}</h2><div class="gold">${item.note ? "金块：" + esc(item.note) : "无答案问题"}</div>${runBlock(item, "base")}${runBlock(item, "new")}`
    : `<div class="empty">选一道题，看看两次运行分别返回了什么证据。<br><br>先看"变坏"里的几条：多数时候不是检索退步，而是另一个块其实也能答。</div>`;
}

renderFilters(); renderRows(); renderDetail();
</script>
